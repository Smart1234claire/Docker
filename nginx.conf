http {
    # Load balancing pour Apache
    upstream apache_servers {
        server apache1:8081;  # Correspond au port exposé par apache1
        server apache2:8082;  # Correspond au port exposé par apache2
    }

    # Load balancing pour MySQL
    upstream mysql_servers {
        server mysql1:3306;  # Correspond au port exposé par mysql1
        server mysql2:3307;  # Correspond au port exposé par mysql2
    }

    # Load balancing pour Neo4j (HTTP interface)
    upstream neo4j_http_servers {
        server neo4j1:7474;  # Correspond au port HTTP exposé par neo4j1
        server neo4j2:7475;  # Correspond au port HTTP exposé par neo4j2
    }

    # Load balancing pour Neo4j (Bolt protocol)
    upstream neo4j_bolt_servers {
        server neo4j1:7687;  # Correspond au port Bolt exposé par neo4j1
        server neo4j2:7688;  # Correspond au port Bolt exposé par neo4j2
    }

    # Serveur pour Apache
    server {
        listen 80;  # Port public pour Apache via le load balancer
        location / {
            proxy_pass http://apache_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Serveur pour MySQL (API ou requêtes spécifiques)
    server {
        listen 3306;  # Port public pour MySQL via le load balancer
        location / {
            proxy_pass http://mysql_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Serveur pour Neo4j HTTP interface
    server {
        listen 7474;  # Port public pour Neo4j HTTP via le load balancer
        location / {
            proxy_pass http://neo4j_http_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Serveur pour Neo4j Bolt protocol
    server {
        listen 7687;  # Port public pour Neo4j Bolt via le load balancer
        location / {
            proxy_pass http://neo4j_bolt_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
